services:
  web:
    build: .
    volumes:
      - db_data:/app/db 
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=False

  nginx:
    image: nginx:alpine
    volumes:
      - /mnt/c/Users/fedya/Documents/School/year3/stivpp/3/kolbasa_project/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  db_data:
  static_volume: