<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>

    {% if kolbasas %}
        <ul>
        {% for k in kolbasas %}
            <li>
                <a href="{% url 'product_detail' k.pk %}">
                    {{ k.brand }} ({{ k.kind }}) — {{ k.weight }} г
                </a>
                {% if k.precut %}🍴 нарезка{% endif %}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>В каталоге пока нет колбас. Добавьте их через <a href="/admin/">админку</a>.</p>
    {% endif %}

    <p><a href="{% url 'about' %}">О сервисе</a></p>
</body>
</html>
