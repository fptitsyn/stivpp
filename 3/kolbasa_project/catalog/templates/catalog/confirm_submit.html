{% extends 'catalog/base.html' %}

{% block title %}Подтверждение отправки{% endblock %}

{% block content %}
<h1>Отправить корзину?</h1>
<p>Общая сумма: {{ cart.total_sum|floatformat:2 }} руб.</p>
<p>После отправки изменить корзину будет нельзя.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-warning">Да, отправить</button>
  <a href="{% url 'cart_detail' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
